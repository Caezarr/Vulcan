name: Validate Skills/Agents Index

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-index-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Check INDEX.md completeness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Run index validation
        run: |
          bash scripts/validate-index.sh
      
      - name: Report status
        if: failure()
        run: |
          echo "::error::Skills/agents index validation failed. See logs above for missing entries."
